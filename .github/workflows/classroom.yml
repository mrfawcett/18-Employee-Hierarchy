name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integrity check - tests, pom.xml and grading.json must be unchanged
        run: |
          EXPECTED="8587ed3f2b7c276e85a4902ef784d4d09f1247b1731a0648c8544bbc5fe49b76"
          ACTUAL=$( (for f in $(find src/test/java -type f -name '*.java' | LC_ALL=C sort) pom.xml grading.json; do sed 's/\r$//' "$f"; done) | sha256sum | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The test files, pom.xml, or grading.json in this repository differ from the assignment template. Grading has been stopped. Restore the original files (git checkout origin/main -- src/test pom.xml grading.json) and push again."
            exit 1
          fi
          echo "Integrity check passed."
      - name: "HourlyEmployee: constructor, getters, getEmployeeInfo (15)"
        id: hourlyemployee
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "HourlyEmployee: constructor, getters, getEmployeeInfo"
          setup-command: ''
          command: mvn -B -q test -Dtest=HourlyEmployeeTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 15
      - name: "HourlyEmployee.calculatePay with overtime past 40 hours (15)"
        id: overtimepay
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "HourlyEmployee.calculatePay with overtime past 40 hours"
          setup-command: ''
          command: mvn -B -q test -Dtest=OvertimePayTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 15
      - name: "Manager: constructor, getters, calculatePay, getEmployeeInfo (20)"
        id: manager
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Manager: constructor, getters, calculatePay, getEmployeeInfo"
          setup-command: ''
          command: mvn -B -q test -Dtest=ManagerTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 20
      - name: "canSupervise with instanceof (Manager) and its override (Executive) (25)"
        id: cansupervise
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "canSupervise with instanceof (Manager) and its override (Executive)"
          setup-command: ''
          command: mvn -B -q test -Dtest=CanSuperviseTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 25
      - name: "Executive: constructor, getStockOptions, calculatePay via super, getEmployeeInfo (25)"
        id: executive
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Executive: constructor, getStockOptions, calculatePay via super, getEmployeeInfo"
          setup-command: ''
          command: mvn -B -q test -Dtest=ExecutiveTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 25
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          HOURLYEMPLOYEE_RESULTS: "${{ steps.hourlyemployee.outputs.result }}"
          OVERTIMEPAY_RESULTS: "${{ steps.overtimepay.outputs.result }}"
          MANAGER_RESULTS: "${{ steps.manager.outputs.result }}"
          CANSUPERVISE_RESULTS: "${{ steps.cansupervise.outputs.result }}"
          EXECUTIVE_RESULTS: "${{ steps.executive.outputs.result }}"
        with:
          runners: hourlyemployee,overtimepay,manager,cansupervise,executive
